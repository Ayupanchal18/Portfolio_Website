    <script>
        /* ── Dark Mode with localStorage persistence ── */
        const checkbox = document.getElementById('checkbox');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            checkbox.checked = true;
        }
        checkbox.addEventListener('change', () => {
            document.body.classList.toggle('dark');
            if (document.body.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.removeItem('theme');
            }
        });

        /* ── EmailJS Contact Form ── */
        (function() {
            // TODO: Replace with your EmailJS credentials from https://emailjs.com
            const EMAILJS_SERVICE_ID  = 'YOUR_SERVICE_ID';
            const EMAILJS_TEMPLATE_ID = 'YOUR_TEMPLATE_ID';
            const EMAILJS_PUBLIC_KEY  = 'YOUR_PUBLIC_KEY';

            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

            const form = document.getElementById('contactFormPage');
            if (!form) return;

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const submitBtn = document.getElementById('submit-pg');
                submitBtn.disabled = true;
                submitBtn.querySelector('span').textContent = 'Sending…';

                const name    = document.getElementById('name-pg').value.trim();
                const email   = document.getElementById('email-pg').value.trim();
                const subject = document.getElementById('subject-pg').value.trim();
                const message = document.getElementById('message-pg').value.trim();

                if (!name || !email || !subject || !message) {
                    showFormMsg('Please fill in all fields.', 'error');
                    resetBtn(submitBtn);
                    return;
                }

                emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    from_name: name,
                    reply_to:  email,
                    subject:   subject,
                    message:   message
                }).then(() => {
                    showFormMsg('✓ Message sent! I\'ll get back to you soon.', 'success');
                    form.reset();
                    resetBtn(submitBtn);
                }, (err) => {
                    console.error('EmailJS error:', err);
                    showFormMsg('Something went wrong. Please email Ayupanchal00@gmail.com directly.', 'error');
                    resetBtn(submitBtn);
                });
            });

            function showFormMsg(msg, type) {
                let el = document.getElementById('form-message-pg');
                if (!el) {
                    el = document.createElement('p');
                    el.id = 'form-message-pg';
                    el.style.cssText = 'margin-top:12px;font-weight:500;';
                    form.appendChild(el);
                }
                el.textContent = msg;
                el.style.color = type === 'success' ? '#28a745' : '#dc3545';
            }

            function resetBtn(btn) {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Send Message';
            }
        })();
    </script>
